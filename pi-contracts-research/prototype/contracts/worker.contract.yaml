# =============================================================================
# Worker agent contract — AgentContract schema (spec 0.1.0-draft)
#
# This is the SINGLE SOURCE OF TRUTH for the prototype. AGENTS.md, the guard
# rules, and the eval cases are all COMPILED projections of this file.
# Nothing downstream is hand-written; see compile.mjs.
#
# Design note: AgentContract's base vocabulary is natural language
# ("must: - respond in the user's language"). A language clause cannot be
# enforced. So every clause here carries a `check` block naming one kind from a
# small closed vocabulary of executable checks (see CHECK VOCABULARY below).
# A clause with no executable `check` is a candidate for the "unoperationalised
# rule" failure mode and the compiler will refuse to pass it silently.
# =============================================================================

agent: worker
spec-version: "0.1.0"
version: "0.3.0"
description: >
  Execution worker for a spec/test-driven repository. Runs bounded, mechanical
  implementation tasks. Never plans, never reviews, never expands its own scope.
tags: [worker, coding, bounded]

# -----------------------------------------------------------------------------
# Preconditions: checked BEFORE the agent runs.
# -----------------------------------------------------------------------------
requires:
  - text: a_task_file_exists
    judge: deterministic
    description: The worker must be given a task identifier that resolves to a file.
    check:
      kind: file_exists
      # `mode: any` is explicit on purpose. With several globs the default is
      # ambiguous, and requiring ALL of them fails on a repo that has only one.
      params: { globs: ["TASKS.md", "tasks/**"], mode: any }
    on_fail: block

# -----------------------------------------------------------------------------
# Invariants: MUST hold on every step. This is the load-bearing layer.
# -----------------------------------------------------------------------------
invariant:
  - text: no_write_outside_boundary
    judge: deterministic
    description: The worker may only modify files inside the task boundary.
    check:
      kind: file_boundary
      params:
        include: ["src/**"]
        exclude: ["node_modules/**", ".git/**"]
        # absolute paths are normalized to repo-relative before matching
        normalize: repo_relative
    on_fail: block

  - text: no_write_to_protected_paths
    judge: deterministic
    description: >
      CI config, lockfiles and docs-of-record are not the worker's to change.
      NOTE: test files are deliberately NOT in this list. Test governance belongs
      solely to no_test_weakening, which permits adding tests and forbids
      weakening them. An earlier revision of this contract listed **/*.test.js here
      as well, which contradicted the permission to add tests and caused the
      guard to BLOCK a legitimate task. Overlapping checks are a contract bug.
    check:
      kind: path_protected
      params:
        patterns:
          - "**/package-lock.json"
          - "**/README.md"
          - "**/.github/workflows/**"
    on_fail: block

  - text: no_test_weakening
    judge: deterministic
    description: Tests may be added to. Tests may not be weakened, skipped or deleted.
    check:
      kind: test_integrity
      params:
        test_globs: ["**/*.test.js", "**/*.test.ts"]
        forbid_added: ["\\.skip\\s*\\(", "\\.only\\s*\\(", "\\btest\\.todo\\s*\\("]
        forbid_removed_assertions: true
    on_fail: block

  - text: no_repo_mutation_by_worker
    judge: deterministic
    description: The worker does not commit, stage, branch, or clean. That is the orchestrator's job.
    check:
      kind: command_forbidden
      # git subcommands are matched STRUCTURALLY, on argv, not by regex.
      # MEASURED BYPASS: the previous regex `\bgit\s+(commit|add|...)\b` was
      # defeated by `git -C /path commit -m "x"`, because `-C` sits between
      # `git` and the subcommand. A commit landed in a live run while
      # no_repo_mutation_by_worker was an active blocking guard. The regex has
      # been moved out of `patterns` and into `git_subcommands`; do not put it
      # back — a text match over a command line is bypassable by any flag.
      params:
        git_subcommands: [commit, add, push, reset, checkout, switch, clean, stash, rebase, merge]
        patterns:
          - "\\brm\\s+-[rRf]{1,2}"
          - "\\bnpm\\s+(install|uninstall|publish)\\b"
          - "\\bsudo\\b"
    on_fail: block

# -----------------------------------------------------------------------------
# Obligations: things the worker must actually do.
# -----------------------------------------------------------------------------
must:
  - text: tests_run_before_claiming_done
    judge: deterministic
    description: >
      A completion claim must be backed by a real, passing test run. The harness
      records the test output itself, from the transcript — you do NOT need to
      paste it into your message.

      WHY THIS CHANGED. The previous clause required the model to re-quote test
      output it had already received in a tool result. Measured on the user's own
      hardware it failed 5/5 at 6-bit and 3/3 at 4-bit. That is a summarisation
      habit ("all 3 tests pass"), not a capability ceiling, and no prompt fixes
      it. The rule keeps its force; the model stops carrying the bookkeeping.
    check:
      kind: evidence_captured
      params:
        test_command_patterns: ["\\bnpm\\s+test\\b", "\\bnode\\s+--test\\b", "\\byarn\\s+test\\b", "\\bpytest\\b", "\\bgo\\s+test\\b"]
        ran_patterns: ["# pass", "ℹ pass", "Tests:", "ok \\d+", "PASS"]
        passed_patterns: ["# fail 0", "ℹ fail 0", "0 failed", "FAIL 0"]
        failed_patterns: ["# fail [1-9]", "ℹ fail [1-9]", "[1-9][0-9]* failed", "FAILED"]
        claim_patterns: ["\\b(done|complete|completed|implemented|finished|shipped)\\b"]
        # ENFORCE, not merely observe. Without this the clause runs on
        # agent_settled, which is notification-only, so a violation is recorded
        # after the run has already ended. Measured cost of that: the model
        # claimed completion without running the suite in 3/5 compliant runs,
        # twice in a row. With this flag the clause ALSO gates at
        # agent_before_settle, the one boundary that can request a continuation,
        # and sends the model back to run the tests. Fires once per run.
        enforce_before_settle: true
    on_fail: block

  - text: state_the_active_invariants
    judge: deterministic
    description: >
      The worker must name the invariants it is operating under in its final
      message. A rule the worker never surfaces is a rule that is not in effect.
      Measured: the 4-bit model failed this 3/3; the 6-bit model passed 5/5. It is
      capability-sensitive, but unlike evidence_capture it is a short fixed
      string, so it is worth keeping as a model obligation.
    check:
      kind: always_state
      params:
        tokens:
          - "NO-EDIT-OUTSIDE-BOUNDARY"
          - "NO-WEAKEN-TESTS"
          - "EVIDENCE-REQUIRED"
    on_fail: warn

# -----------------------------------------------------------------------------
# Hard limits.
# NOTE: only one tool-call limit is declared. An earlier revision also declared
# `max_steps: 40`, which in this engine is counted from the same counter as
# max_tool_calls — so max_steps always fired first and max_tool_calls: 60 was
# unreachable dead code. Two checks over one surface is a contract bug; see
# FINDINGS. If per-turn limits are ever needed, the engine must count turns
# separately first.
# -----------------------------------------------------------------------------
limits:
  max_tool_calls: 60

# -----------------------------------------------------------------------------
# Violation policy.
# -----------------------------------------------------------------------------
on_violation:
  default: block

# -----------------------------------------------------------------------------
# Permission record. Informational in this spec version; kept because it is the
# natural place to document what the worker MAY do, and it gives the compiler a
# clause to render into AGENTS.md without inventing text.
# -----------------------------------------------------------------------------
can:
  - read any file in the repository
  - run the project's test command
  - modify files matching the active task boundary
  - create new files inside the active task boundary
